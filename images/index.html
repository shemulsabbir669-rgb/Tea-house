<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>
    <!-- Tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--  Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- Font awesomeCDM -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Manrope", sans-serif;
      }
    </style>
  </head>

  <body>


    <!-- hero section -->
<section class="max-w-7xl mx-auto px-6 lg:px-8 py-12 lg:py-20 grid grid-cols-1 lg:grid-cols-2 items-center gap-10 lg:gap-16 overflow-hidden">
  
  <!-- LEFT SIDE -->
  <div class="max-w-xl">
    
    <!-- Top Badge -->
    <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-orange-50 text-orange-600 text-xs font-semibold tracking-wide uppercase mb-4 border border-orange-100">
      <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
      Premium Tea Collection
    </span>

    <h1 class="text-4xl sm:text-5xl lg:text-6xl xl:text-[68px] leading-[1.1] font-extrabold text-[#1C1C1C] tracking-tight">
      It's good <br class="hidden sm:inline" />
      tea time at <br class="hidden sm:inline" />
      <span class="bg-gradient-to-r from-[#FF8938] via-[#FF5500] to-[#FF0000] bg-clip-text text-transparent">
        The Tea House
      </span>
    </h1>

    <p class="text-red-700  font-semibold md:text-lg leading-relaxed mt-6 max-w-md">
      Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your Taste Buds.
    </p>

    <!-- Action Button -->
     
    <div class="mt-8 flex items-center gap-4">
      <button class="group px-7 py-3.5 rounded-xl text-white font-semibold bg-gradient-to-r from-[#FF8938] to-[#FF0000] hover:shadow-lg hover:shadow-orange-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 flex items-center gap-3 cursor-pointer">
        Explore More
        <i class="fa-solid fa-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-1.5"></i>
      </button>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="relative flex justify-center lg:justify-end items-center mt-6 lg:mt-0">
    
    <!-- Background Ambient Glow -->
    <div class="relative w-full max-w-[620px]">
      <div class="absolute -inset-4 bg-gradient-to-tr from-orange-300/40 to-red-300/30 rounded-full blur-3xl -z-10"></div>

      <!-- Banner Image -->
      <img
        src="./banner.png"
        alt="Tea House"
        class="w-full object-contain drop-shadow-2xl hover:scale-[1.02] transition-transform duration-500"
      />
    </div>

    <!-- Rating Card -->
    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 lg:left-4 lg:translate-x-0 bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl border border-white/60 px-5 py-3.5 flex items-center gap-4 min-w-[170px] hover:-translate-y-1 transition-transform duration-300">
      
      <!-- Star Icon Wrapper -->
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-50 to-orange-100/80 flex items-center justify-center shrink-0 border border-orange-200/50">
        <img
          src="./Group 5 (2).png"
          alt="Rating"
          class="w-6 h-6 object-contain"
        />
      </div>

      <!-- Rating Text -->
      <div>
        <h2 class="font-extrabold text-2xl text-[#1C1C1C] leading-none tracking-tight">
          5.00
        </h2>
        <p class="text-xs font-medium text-[#777777] mt-1 whitespace-nowrap">
          Trust Pilot Ratings
        </p>
      </div>
    </div>

  </div>
</section>

  </body>
</html>
